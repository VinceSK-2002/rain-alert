name: Rain alert

on:
  schedule:
    # GitHub uses UTC. 06:00 in Vienna is 04:00 UTC in summer (CEST) and 05:00 UTC
    # in winter (CET), so the job starts at both times and only runs at 06:xx Vienna time.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:        # adds a "Run workflow" button for manual tests
    inputs:
      prob_threshold:
        description: "Rain probability threshold in % (0 = always send a test email)"
        default: "10"

permissions:
  contents: write           # needed to commit the log and forecast history

jobs:
  rain-check:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 06:xx in Vienna?
        id: time
        run: |
          hour=$(TZ=Europe/Vienna date +%H)
          echo "Vienna time: $(TZ=Europe/Vienna date)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 06:xx in Vienna, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.time.outputs.run == 'true'
        with:
          use-public-rspm: true   # pre-built packages, much faster installs

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.time.outputs.run == 'true'
        with:
          packages: |
            any::httr
            any::jsonlite
            any::tidyverse
            any::glue
            any::blastula

      - name: Run rain check
        if: steps.time.outputs.run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RAIN_RECIPIENTS: ${{ secrets.RAIN_RECIPIENTS }}
          RAIN_PROB_THRESHOLD: ${{ inputs.prob_threshold || '10' }}
        run: Rscript rain-alert.R

      - name: Save log and forecast history to the repo
        if: always() && steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Rain check $(TZ=Europe/Vienna date +%F)" || echo "Nothing to commit"
          git push
